name: Chat 4 Windows Cargo lock and validation (one-shot)

# Run exactly once when this workflow is introduced or deliberately changed.
# Source PR CI remains enabled and independently validates any generated commit.
on:
  push:
    branches: [feat/tl-04-curseforge-install]
    paths:
      - '.github/workflows/chat4-windows-lock.yml'

permissions:
  contents: write

concurrency:
  group: chat4-windows-lock
  cancel-in-progress: false

jobs:
  generate-lock-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate genuine Cargo lockfiles on Windows
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Root workspace format
        run: cargo fmt --all -- --check
      - name: Root workspace Clippy (locked)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Root workspace tests (locked)
        run: cargo test --locked --workspace --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build desktop frontend
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desktop Rust check (locked)
        run: cargo +1.90.0 check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit verified lockfiles to this feature branch only
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF" -ne "refs/heads/feat/tl-04-curseforge-install") { throw "Unexpected ref" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock apps/desktop/src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo lockfiles already current"
          } else {
            git commit -m "build(pack): regenerate verified Windows Cargo lockfiles"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:refs/heads/feat/tl-04-curseforge-install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Save generated Windows lockfiles as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat4-windows-lockfiles
          path: |
            Cargo.lock
            apps/desktop/src-tauri/Cargo.lock
          retention-days: 7
