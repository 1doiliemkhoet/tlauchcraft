name: Forge 1.20.1 real Windows runtime smoke
on:
  push:
    branches: [feat/p0-forge-1201-skyfactory5]
    paths:
      - '.github/workflows/forge-1201-windows-smoke.yml'
      - 'crates/tl-loader/**'
      - 'crates/tl-pack/**'
      - 'crates/tl-game/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-1201-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run six verified official processors and prepare launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "tl-forge-1201-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "TL_FORGE_SMOKE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          $java = Join-Path $env:JAVA_HOME 'bin\java.exe'
          & $java -version
          cargo run --locked --release -p tl-pack --example forge_1201_windows_smoke -- "$root" "$java" --approve-official-processors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload processor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1201-windows-processor-logs
          path: ${{ env.TL_FORGE_SMOKE_ROOT }}/cache/forge-execution/**/*.log
          if-no-files-found: ignore
