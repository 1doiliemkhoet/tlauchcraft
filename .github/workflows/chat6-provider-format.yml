name: Chat 6 Provider Windows Format Capture
on:
  pull_request:
    branches: [develop]
    paths:
      - 'crates/tl-skin/**'
      - '.github/workflows/chat6-provider-format.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Rustfmt canonical files (do not claim branch format PASS)
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($entry in @(@("FMT_PROVIDER_PART", "crates/tl-skin/src/provider.rs"), @("FMT_TEST_PART", "crates/tl-skin/tests/provider_tests.rs"))) {
            $key = $entry[0]
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($entry[1]))
            for ($i = 0; $i -lt $b64.Length; $i += 3000) {
              Write-Output ($key + ":" + $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)))
            }
          }
      - name: Windows Clippy after formatting
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Windows tests after formatting
        run: cargo test --locked --workspace --all-targets
