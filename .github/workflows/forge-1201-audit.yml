name: Forge 1.20.1 installer evidence
on:
  push:
    branches: [feat/p0-forge-1201-skyfactory5]
    paths:
      - '.github/workflows/forge-1201-audit.yml'
      - 'crates/tl-loader/src/forge_family.rs'
      - 'crates/tl-loader/examples/forge_family_audit.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify official Forge 47.4.0 and capture metadata without executing Java
        shell: python
        run: |
          import hashlib, io, json, pathlib, urllib.request, zipfile
          mc, forge = "1.20.1", "47.4.0"
          expected = "b73203963ea70aee0c38dc58de1f6d16a766605b"
          name = f"forge-{mc}-{forge}-installer.jar"
          url = f"https://maven.minecraftforge.net/net/minecraftforge/forge/{mc}-{forge}/{name}"
          req = urllib.request.Request(url, headers={"User-Agent": "TLaunchCraft-Metadata-Audit/1"})
          with urllib.request.urlopen(req, timeout=45) as response:
              assert response.geturl() == url, "Unexpected installer redirect"
              blob = response.read(32 * 1024 * 1024 + 1)
          assert 0 < len(blob) <= 32 * 1024 * 1024
          assert hashlib.sha1(blob).hexdigest() == expected, "Installer SHA-1 mismatch"
          out = pathlib.Path("forge-1201-evidence")
          out.mkdir()
          with zipfile.ZipFile(io.BytesIO(blob)) as jar:
              for name in ("install_profile.json", "version.json"):
                  assert len([x for x in jar.infolist() if x.filename == name]) == 1
                  assert 0 < jar.getinfo(name).file_size <= 2 * 1024 * 1024
                  raw = jar.read(name)
                  (out / name).write_bytes(raw)
          p = json.loads((out / "install_profile.json").read_bytes())
          v = json.loads((out / "version.json").read_bytes())
          assert p.get("minecraft") == mc
          assert v.get("inheritsFrom") == mc
          assert v.get("id") == f"{mc}-forge-{forge}"
          assert isinstance(p.get("processors"), list)
          report = {
              "status": "METADATA_ONLY_NOT_PLAYABLE",
              "installer_sha1": expected,
              "installer_sha256": hashlib.sha256(blob).hexdigest(),
              "profile_sha1": hashlib.sha1((out / "install_profile.json").read_bytes()).hexdigest(),
              "derived_canonical_sha1": hashlib.sha1(json.dumps(v, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()).hexdigest(),
              "profile_library_count": len(p.get("libraries", [])),
              "derived_library_count": len(v.get("libraries", [])),
              "processors": [x for x in p["processors"] if "client" in x.get("sides", ["client", "server"])],
              "data": p.get("data"),
              "mainClass": v.get("mainClass"),
              "arguments": v.get("arguments"),
              "javaVersion": v.get("javaVersion"),
          }
          (out / "report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust regression and exact official metadata audit
        run: |
          cargo test --locked -p tl-loader forge_family::tests
          cargo run --locked -p tl-loader --example forge_family_audit -- 1.20.1 47.4.0 forge-1201-evidence/install_profile.json forge-1201-evidence/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1201-47.4.0-metadata
          path: forge-1201-evidence/
          if-no-files-found: error
