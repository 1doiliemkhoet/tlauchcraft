name: Foundation Windows Cargo.lock Refresh
on:
  push:
    branches: [feat/tl-01-concurrency-identity]
    paths:
      - '.github/workflows/foundation-win-lock.yml'
permissions:
  contents: write
jobs:
  windows-cargo-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Regenerate Cargo.lock using real Windows Cargo
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($meta.workspace_members).Count -ne 7) { throw "Expected 7 workspace crates" }
          Write-Host "WINDOWS_CARGO_LOCK_GENERATED; WORKSPACE_COUNT=$(@($meta.workspace_members).Count)"
      - name: Commit generated Cargo.lock to feature branch only
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- Cargo.lock)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'build: refresh seven-crate Cargo.lock using Windows Cargo 1.88'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:feat/tl-01-concurrency-identity
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Cargo.lock already matches seven-crate workspace'
          }
