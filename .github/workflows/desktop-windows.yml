name: Desktop Windows checks
on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

# CI verifies committed inputs only; it never commits or pushes to pull-request branches.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require committed dependency locks
        shell: pwsh
        run: |
          if (!(Test-Path apps/desktop/package-lock.json)) { throw "Missing committed npm package-lock.json" }
          if (!(Test-Path apps/desktop/src-tauri/Cargo.lock)) { throw "Missing committed Tauri Cargo.lock" }
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: npm test
        working-directory: apps/desktop
        run: npm test
      - name: npm run build
        working-directory: apps/desktop
        run: npm run build
      - name: Install desktop Rust stable (Tauri requires rustc >= 1.90)
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Tauri cargo check (Windows MSVC, locked)
        working-directory: apps/desktop/src-tauri
        run: cargo +stable check --locked
