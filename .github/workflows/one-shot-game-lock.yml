name: Control one-shot tl-game Cargo lockfile
on:
  push:
    branches: ['feat/tl-02-game-core']
    paths:
      - '.github/workflows/one-shot-game-lock.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.1'
      - name: Generate a real Cargo.lock for this workspace
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [System.IO.File]::ReadAllBytes("Cargo.lock")
          $encoded = [System.Convert]::ToBase64String($bytes)
          for ($i = 0; $i -lt $encoded.Length; $i += 2048) {
            $size = [Math]::Min(2048, $encoded.Length - $i)
            Write-Output ("TLLCK:" + $encoded.Substring($i, $size))
          }
