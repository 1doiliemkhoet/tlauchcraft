name: Control one-shot modpack Cargo.lock
on:
  push:
    branches: ['feat/tl-04-modpack']
    paths:
      - '.github/workflows/control-one-shot-pack-lock.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - name: Generate genuine workspace Cargo.lock
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [System.IO.File]::ReadAllBytes("Cargo.lock")
          $encoded = [System.Convert]::ToBase64String($bytes)
          for ($i = 0; $i -lt $encoded.Length; $i += 2048) {
            $size = [Math]::Min(2048, $encoded.Length - $i)
            Write-Output ("TLPACKLOCK:" + $encoded.Substring($i, $size))
          }
