name: Generate Foundation Cargo lockfile
on:
  push:
    branches: ['feat/tl-01-foundation']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.1'
      - name: Generate reproducible dependency lock
        run: cargo generate-lockfile
      - name: Push lockfile if new
        run: |
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 || ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: lock Rust dependency graph"
            git push origin HEAD:feat/tl-01-foundation
          fi
