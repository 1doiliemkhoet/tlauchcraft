name: Format owned Rust files
on:
  push:
    branches: ['feat/tl-01-foundation']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting if necessary
        run: |
          if ! git diff --quiet -- crates/tl-core crates/tl-storage; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/tl-core crates/tl-storage
            git commit -m "style: rustfmt foundation crates"
            git push origin HEAD:feat/tl-01-foundation
          fi
