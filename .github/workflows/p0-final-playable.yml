name: P0 Final Forge Publish + Desktop Play Windows

on:
  push:
    branches: [feat/p0-final-playable-bridge]
  pull_request:
    branches: [integration/p0-playable-single-run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-final-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-on-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p0-final-playable-bridge'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-final-playable-bridge
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt
      - name: Format Rust changes and push only when necessary
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Rust formatting already clean'; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates apps/desktop/src-tauri
          git commit -m "style: format P0 Forge publisher and Desktop bridge"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/p0-final-playable-bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Root workspace fmt
        run: cargo fmt --all -- --check
      - name: Locked Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Locked tests
        run: cargo test --locked --workspace --all-targets

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend dependency install
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Frontend bundle
        working-directory: apps/desktop
        run: npm run build
      - name: Desktop stable Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Locked desktop compile and tests
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo +stable check --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  nsis:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Frontend dependency install
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Build real NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm run tauri build -- --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installer smoke
        shell: pwsh
        run: ./apps/desktop/scripts/g8-installer-smoke.ps1
      - name: Upload NSIS and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-final-nsis-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/g8-evidence/**
          if-no-files-found: warn
          retention-days: 14
