name: P0 Final Forge Publish + Desktop Play Windows

on:
  pull_request:
    branches: [integration/p0-playable-single-run]
    paths:
      - 'crates/**'
      - 'apps/desktop/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/p0-final-playable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-final-bridge-${{ github.event.pull_request.number || github.ref }}
  # Cancel obsolete PR builds, never interrupt an explicitly requested manual release build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rust/desktop validation is owned by p0-final-forge-bridge.yml.
  # Keep the heavy, real installer build for PR acceptance and manual QA.
  nsis:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: nsis-release
      - name: Frontend dependency install
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Build real NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm run tauri build -- --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installer smoke
        shell: pwsh
        run: ./apps/desktop/scripts/g8-installer-smoke.ps1
      - name: Upload NSIS and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-final-nsis-${{ github.run_id }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/g8-evidence/**
          if-no-files-found: warn
          retention-days: 14
