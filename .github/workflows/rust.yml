name: Rust Foundation

# Windows-only launcher. Run focused PR checks; no Linux runners or docs-only CI.
on:
  pull_request:
    branches: [develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlauchcraft-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Temporary Chat 3 diagnostic, removed before Control review.
      - name: Generate Cargo lock via Windows Cargo
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $blob = [Convert]::ToBase64String([IO.File]::ReadAllBytes("Cargo.lock"))
          Write-Output "TL03_FORGE_LOCK_BEGIN$blob"+"TL03_FORGE_LOCK_END"
      - name: Ensure every Rust crate is tested by the workspace
        shell: pwsh
        run: |
          $meta = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $members = @($meta.packages | ForEach-Object { [IO.Path]::GetFullPath($_.manifest_path).ToLowerInvariant() })
          $missing = @()
          Get-ChildItem -Path crates -Directory | ForEach-Object {
            $manifest = Join-Path $_.FullName 'Cargo.toml'
            $candidate = [IO.Path]::GetFullPath($manifest).ToLowerInvariant()
            if ((Test-Path $manifest) -and ($members -notcontains $candidate)) {
              $missing += $manifest
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Unregistered crate(s): $($missing -join ', '). Add to root workspace and update Cargo.lock before merging."
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
