name: Forge family installer metadata audit

on:
  push:
    branches: [feat/p0-multiversion-forge-family-20261118]
    paths:
      - '.github/workflows/forge-family-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and audit official pinned installers (metadata only; no execution)
        shell: python
        run: |
          import hashlib, io, json, urllib.request, zipfile
          releases = [
              ("36.2.29", "7d247279cf06eed6ffcf609f36d11e34c70350f3"),
              ("36.2.34", "ab306b654c44d659ce69da5d4f87590b66dc91e8"),
              ("36.2.42", "e09ecf910e4d5eae12fb3564d9b7de212c1958b2"),
          ]
          for version, expected_sha1 in releases:
              url = ("https://maven.minecraftforge.net/net/minecraftforge/forge/"
                     f"1.16.5-{version}/forge-1.16.5-{version}-installer.jar")
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "TLaunchCraft-Metadata-Audit/1"}),timeout=40) as r:
                  blob=r.read(32*1024*1024+1)
              assert len(blob) <= 32*1024*1024 and len(blob)>0
              digest=hashlib.sha1(blob).hexdigest()
              assert digest==expected_sha1,(version,"SHA1 mismatch",digest)
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  p=json.loads(z.read("install_profile.json"))
                  v=json.loads(z.read("version.json"))
                  print("RELEASE",version,"sha1",digest,"size",len(blob))
                  print("META",json.dumps({
                      "forge_id":v.get("id"),
                      "mc":p.get("minecraft"),
                      "profile_version":p.get("version"),
                      "library_count":len(p.get("libraries",[])),
                      "derived_lib_count":len(v.get("libraries",[])),
                      "data_keys":sorted(p.get("data",{})),
                      "data_client":{k:x.get("client") for k,x in p.get("data",{}).items() if k in ["MC_EXTRA_SHA","MC_SLIM_SHA","PATCHED_SHA","MCP_VERSION"]},
                      "processors":[{"jar":x.get("jar"),"outputs":x.get("outputs"),"args":x.get("args")} for x in p.get("processors",[]) if "client" in x.get("sides",["client","server"])],
                  },sort_keys=True))
                  assert len(p.get("processors",[]))<=16
                  assert v.get("inheritsFrom")=="1.16.5"
          print("OFFICIAL_FORGE_FAMILY_METADATA_AUDIT_PASS")
