[workspace]
resolver = "2"
members = ["crates/tl-core", "crates/tl-storage", "crates/tl-game", "crates/tl-loader", "crates/tl-lan"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.40", features = ["serde", "clock"] }
thiserror = "=2.0.12"
rusqlite = { version = "=0.34.0", features = ["bundled", "backup"] }
tempfile = "=3.19.1"
