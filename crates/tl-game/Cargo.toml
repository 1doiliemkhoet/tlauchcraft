[package]
name = "tl-game"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minecraft metadata, verified file installation and local process runtime"

[dependencies]
tl-core = { path = "../tl-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
